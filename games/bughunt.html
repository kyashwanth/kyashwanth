<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Hunt — QA Games</title><link rel="stylesheet" href="shared.css"></head>
<body><script src="shared.js"></script>
<script>
QA.hunt({
  id:'bughunt', max:{easy:400,medium:600,hard:800}, emoji:'🐞', title:'Bug Hunt', aspect:'Functional & UI testing',
  intro:'Inspect a checkout page, find the defects and report them. Click an element, read the inspector, then decide: bug or not? Wrong reports cost points.',
  levelInfo:{ easy:'4 obvious bugs, 150s, 3 hints.', medium:'6 bugs including validation logic, 120s, 1 hint.', hard:'8 bugs including subtle ones, 90s, no hints.' },
  levels:{ easy:{ seconds:150, hints:3, bugs:['typo','total','qty','btn'] }, medium:{ seconds:120, hints:1, bugs:['typo','total','qty','btn','email','expiry'] }, hard:{ seconds:90, hints:0, bugs:['typo','total','qty','btn','email','expiry','link','pin'] } },
  bugs:[
    { id:'typo',   els:['b-cart'],            text:'Typo: "itmes" should be "items".' },
    { id:'total',  els:['b-total'],           text:'Total shows $95.00 but $100 + $5 shipping is $105.00.' },
    { id:'qty',    els:['b-qty'],             text:'Keyboard shows "Qty: 0" but is priced and charged as one item.' },
    { id:'btn',    els:['b-btn'],             text:'"Pay now" is styled as disabled although the form is complete.' },
    { id:'email',  els:['b-email','b-valid'], text:'"jane.doe@example" has no valid domain, yet the form shows a green "valid" tick.' },
    { id:'expiry', els:['b-expiry'],          text:'Expiry "13 / 24" is impossible (month 13) and already in the past.' },
    { id:'link',   els:['b-link'],            text:'Terms link is near-white on white: fails colour contrast (accessibility).' },
    { id:'pin',    els:['b-pin'],             text:'Postal code field holds placeholder-style text ("Enter your zip") instead of a value.' }
  ],
  css:'.app{font-size:15px}.app h3{margin:0 0 4px;font-size:22px}.sub{color:#666;margin:0 0 16px;font-size:14px}.shop-nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding-bottom:12px;margin-bottom:16px}.shop-nav b{color:#e8590c}.shop-nav span{font-size:14px;color:#555}.item{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid #eee;border-radius:10px;margin-bottom:10px}.thumb{width:56px;height:56px;background:#f1f3f5;border-radius:8px;display:grid;place-items:center;font-size:26px}.item .info{flex:1}.item .info small{color:#666;display:block}.price{font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.field label{display:block;font-size:13px;color:#555;margin-bottom:3px}.field div.input{border:1px solid #cfd4da;border-radius:8px;padding:9px 11px;font-size:14px;color:#333}.summary{margin-top:14px;padding:12px;background:#f8f9fa;border-radius:10px}.summary div{display:flex;justify-content:space-between;padding:2px 0}.pay{display:flex;align-items:center;gap:14px;margin-top:16px}.pay .btn{background:#e8590c;color:#fff;border-radius:8px;padding:11px 22px;font-weight:700}.pay .btn.off{background:#e9ecef;color:#c4c9cf}.ok{color:#237a35;font-size:13px}.found{outline:3px solid #3de0c5!important;outline-offset:3px}',
  app: on => `
    <div class="shop-nav"><div><b>QuickKart</b></div><span id="b-cart">Cart (2 ${on('typo') ? 'itmes' : 'items'})</span></div>
    <h3>Checkout</h3><p class="sub">Review your order and pay securely.</p>
    <div class="item"><div class="thumb">🎧</div><div class="info">Wireless Headphones<small>Qty: 1</small></div><div class="price">$59.00</div></div>
    <div class="item"><div class="thumb">⌨️</div><div class="info">Mechanical Keyboard<small id="b-qty">Qty: ${on('qty') ? 0 : 1}</small></div><div class="price">$41.00</div></div>
    <div class="row">
      <div class="field"><label>Email</label><div class="input" id="b-email" data-info="field: email (type=email)">${on('email') ? 'jane.doe@example' : 'jane.doe@example.com'}</div><div class="ok" id="b-valid">✓ Email looks valid</div></div>
      <div class="field"><label>Postal code</label><div class="input" id="b-pin" data-info="field: postal_code (required)">${on('pin') ? 'Enter your zip' : '500081'}</div></div>
    </div>
    <div class="row">
      <div class="field"><label>Card number</label><div class="input">4242 4242 4242 4242</div></div>
      <div class="field"><label>Expiry date</label><div class="input" id="b-expiry" data-info="field: expiry (MM / YY). Today: 2026-10">${on('expiry') ? '13 / 24' : '12 / 28'}</div></div>
    </div>
    <div class="summary"><div><span>Subtotal</span><span>$100.00</span></div><div><span>Shipping</span><span>$5.00</span></div><div><b>Total</b><b id="b-total">${on('total') ? '$95.00' : '$105.00'}</b></div></div>
    <div class="pay"><div class="btn ${on('btn') ? 'off' : ''}" id="b-btn" data-info="all required fields are filled and valid">Pay now</div><a id="b-link" style="font-size:13px;color:${on('link') ? '#f1f3f5' : '#1c5fd4'}">Terms &amp; Conditions</a></div>`
});
</script></body></html>
