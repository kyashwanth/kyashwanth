<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Bug found</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9E%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#07080d; color:#eceef5; font:17px/1.6 Inter,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .box { max-width:560px; }
  .bug { font-size:72px; display:inline-block; animation:w 3s ease-in-out infinite; } @keyframes w { 50% { transform:rotate(10deg) translateY(-6px); } }
  h1 { font-size:clamp(40px,10vw,72px); letter-spacing:-.04em; margin:8px 0; background:linear-gradient(100deg,#7c8cff,#3de0c5); -webkit-background-clip:text; background-clip:text; color:transparent; }
  pre { background:#0b0d16; border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:14px 16px; font:14px/1.6 ui-monospace,Menlo,monospace; color:#cfe3ff; overflow-x:auto; }
  a { display:inline-block; margin:6px 10px 0 0; padding:11px 20px; border-radius:12px; font-weight:700; color:#07080d; text-decoration:none; background:linear-gradient(100deg,#7c8cff,#3de0c5); }
  a.g { background:none; color:#eceef5; border:1px solid rgba(255,255,255,.2); }
</style></head>
<body><div class="box">
  <div class="bug">🐞</div>
  <h1>404</h1>
  <p>You found a bug. Nice catch! The page you wanted doesn't exist.</p>
  <pre id="log"></pre>
  <a id="home" href="/">Back to the portfolio</a><a class="g" id="games" href="/games/index.html">Play QA games</a>
</div>
<script>
  const base = location.pathname.startsWith('/kyashwanth/') ? '/kyashwanth/' : '/';   // works on a project page or a custom domain
  home.href = base; games.href = base + 'games/index.html';
  log.textContent = `GET ${location.pathname}\n→ 404 Not Found\n\nSeverity: Low   Priority: Low\nSteps to reproduce: type a wrong URL\nExpected: a page\nActual: this`;
</script></body></html>
